<!-- Modal for Soulseek search results -->
<div class="modal fade" id="slskdResultsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-music-note-list"></i> Select File to Download
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="slskdResultsLoading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Searching for results...</p>
                </div>
                <div id="slskdResultsError" class="alert alert-danger" style="display:none"></div>
                <div id="slskdResultsList" style="display:none">
                    <div id="slskdResultsEmpty" class="alert alert-info" style="display:none">
                        <i class="bi bi-info-circle"></i> No results found with acceptable match score.
                    </div>
                    <div id="slskdResultsTable" style="display:none">
                        <div class="list-group" id="slskdResultsBody"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div id="slskdSearchAgainDiv" style="display:none" class="w-100 me-2">
                    <div class="input-group">
                        <input type="text" class="form-control" id="slskdNewQuery" placeholder="Enter new search query...">
                        <button class="btn btn-outline-secondary" onclick="searchAgainSlskd()" title="Search with different keywords">
                            <i class="bi bi-search"></i> Search Again
                        </button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
