{# MusicBrainz Release Match Modal — triggered by openReleaseMatchModal() in album_detail.js #}
<div class="modal fade" id="musicbrainzReleaseMatchModal" tabindex="-1" aria-labelledby="musicbrainzReleaseMatchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="musicbrainzReleaseMatchModalLabel">
          <i class="bi bi-disc"></i> MusicBrainz Release Match
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="mbReleaseMatchStatus" class="text-center py-4" style="display:none;">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <div class="mt-2">Searching MusicBrainz...</div>
        </div>
        <div id="mbReleaseMatchError" class="alert alert-danger" style="display:none;"></div>
        <div id="mbReleaseMatchResults"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
