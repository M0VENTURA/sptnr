{#
  Release Picker Modal — shown when auto-match is not confident.
  Included by album_detail.html.
#}
<div class="modal fade" id="releasePickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-list-ul me-2"></i>Select Specific Release</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small mb-3">
                    The automatic match was not confident enough. Please select the release that best matches your local tracks.
                    Expand a release to view its track list.
                </p>
                <div id="releasePickerStatus" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Fetching releases…</p>
                </div>
                <div id="releasePickerError" class="alert alert-danger" style="display:none;"></div>
                <div id="releasePickerResults"></div>
            </div>
        </div>
    </div>
</div>
