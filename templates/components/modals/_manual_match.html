<!-- Manual Match Modal: link an orphan queue file to a library track -->
<div class="modal fade" id="manualMatchModal" tabindex="-1" aria-labelledby="manualMatchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="manualMatchModalLabel">
          <i class="bi bi-link-45deg text-info"></i> Match Queue Item to Library Track
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="extra-small text-muted">
          Search your library and pick the track this orphan file belongs to. The queue item's
          metadata is updated and it moves to Completed, ready to transfer.
        </p>
        <input type="text" id="matchSearchInput" class="form-control form-control-sm bg-dark text-light border-secondary mb-2"
               placeholder="Search artist, album, or track…" onkeyup="searchMatchTargets(this.value)">
        <div id="matchTargetList" class="list-group list-group-flush extra-small overflow-auto" style="max-height: 60vh;"></div>
      </div>
    </div>
  </div>
</div>
