<!-- Manual Soulseek Search modal (reusable component)
     Ported from the old system's downloads_monitor.html: queue items open
     this modal to run a custom Soulseek search and select a result.  The
     "Select" button links the download to the originating queue row via
     /api/slskd/queue-download when opened from a queue item, so the file is
     moved into the organised album folder automatically. -->
<div class="modal fade" id="soulseekManualSearchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-secondary">
        <h5 class="modal-title"><i class="bi bi-search"></i> Manual Soulseek Search</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <input type="text" id="soulseekManualQuery" class="form-control" placeholder="Artist - Title" autocomplete="off">
          <button class="btn btn-success" id="soulseekManualSearchBtn" type="button" onclick="runSoulseekManualSearch()">
            <i class="bi bi-search"></i> Search
          </button>
        </div>
        <div id="soulseekManualStatus" class="small text-muted mb-2">Enter a query and search.</div>
        <div id="soulseekManualResults"></div>
      </div>
    </div>
  </div>
</div>
