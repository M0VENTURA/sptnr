<!-- qBittorrent search panel (reusable component) -->
{% if qbit_config.enabled %}
<div class="mb-3">
  <div class="input-group">
    <input type="text" class="form-control" id="qbitSearchInput" placeholder="Search torrents...">
    <button class="btn btn-primary" onclick="performQbitSearch()">
      <i class="bi bi-search"></i> Search
    </button>
  </div>
</div>

<div id="qbitLoading" class="text-center py-4" style="display: none;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Searching...</span>
  </div>
  <p class="mt-2">Searching qBittorrent...</p>
</div>

<div id="qbitResults" style="max-height: 600px; overflow-y: auto;"></div>
{% else %}
<div class="alert alert-warning mb-0">
  <i class="bi bi-exclamation-triangle"></i> qBittorrent integration is not enabled.
  <a href="{{ url_for('ui.config_editor') }}">Configure it</a> in config.yaml.
</div>
{% endif %}
