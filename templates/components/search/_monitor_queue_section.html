<!-- Download Queue Section -->
<div class="card mb-4" id="folderGroupsSection" style="display: none;">
  <div class="card-header">
    <!-- Line 1: title + item count pill -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
      <h5 class="card-title mb-0">
        <i class="bi bi-list-task"></i> Download Queue
        <span class="badge bg-info ms-1" id="folderGroupsBadge">0 items</span>
      </h5>
    </div>
    <!-- Line 2: action toolbar — sort left, maintenance right -->
    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <select id="queueSortMode" class="form-select form-select-sm" style="width:auto;" onchange="loadFolderGroups({ forceRender: true, keepVisibleOnEmpty: true })">
        <option value="folder">Sort: Folder</option>
        <option value="artist">Sort: Artist</option>
        <option value="album">Sort: Album</option>
      </select>
      <div class="d-flex align-items-center gap-1">
        <button class="btn btn-sm btn-outline-secondary" onclick="migrateExistingQueueItems(this)" title="Backfill existing queue rows to grouped/source setup">
          <i class="bi bi-arrow-repeat"></i> <span class="d-none d-md-inline">Migrate</span>
        </button>
        <button class="btn btn-sm btn-outline-info" onclick="runQueueCleanup()" title="Remove expired duplicates and fully completed albums from queue">
          <i class="bi bi-broom"></i> <span class="d-none d-md-inline">Cleanup</span>
        </button>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <div id="folderGroupsList" style="max-height: 600px; overflow-y: auto;">
      <!-- Queue items rendered here -->
    </div>
  </div>
  <!-- Footer: pagination belongs below the list -->
  <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2 py-2">
    <span class="text-muted small" id="queuePageSummary">Showing 0 of 0</span>
    <div class="btn-group" role="group">
      <button class="btn btn-sm btn-outline-secondary" id="queuePrevPageBtn" onclick="changeQueuePage(-1)" disabled title="Previous page">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" id="queueNextPageBtn" onclick="changeQueuePage(1)" disabled title="Next page">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>

<!-- Merge Folders Modal -->
<div class="modal fade" id="mergeFoldersModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Merge Folders</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="mergeModalContent">
          <div class="mb-3">
            <label class="form-label">Source Folders Selected:</label>
            <div id="mergeSourceList" class="alert alert-info" style="max-height: 150px; overflow-y: auto;"></div>
          </div>
          <div class="mb-3">
            <label for="mergeDestinationPath" class="form-label">Destination Folder:</label>
            <div class="input-group">
              <input type="text" id="mergeDestinationPath" class="form-control" placeholder="/path/to/merged/folder" />
              <button class="btn btn-outline-secondary" type="button" id="browseDestinationBtn" onclick="showDestinationFolderPicker()">
                <i class="bi bi-folder"></i> Browse
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="mergeConflictStrategy" class="form-label">Conflict Resolution:</label>
            <select id="mergeConflictStrategy" class="form-select">
              <option value="skip">Skip (keep existing files)</option>
              <option value="overwrite">Overwrite (replace with new files)</option>
              <option value="keep-both">Keep Both (rename duplicates)</option>
            </select>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="mergeDryRunCheckbox" checked />
            <label class="form-check-label" for="mergeDryRunCheckbox">
              Run in dry-run mode first (preview without moving files)
            </label>
          </div>
        </div>
        <div id="mergeProgressContent" style="display:none;">
          <div class="alert alert-info">
            <i class="spinner-border spinner-border-sm me-2"></i>
            <span id="mergeProgressText">Processing merge...</span>
          </div>
          <div id="mergeProgressDetails"></div>
        </div>
        <div id="mergeResultsContent" style="display:none;">
          <div id="mergeResultsAlert"></div>
          <div id="mergeResultsDetails"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="mergeCancelBtn">Close</button>
        <button type="button" class="btn btn-primary" id="mergeExecuteBtn" onclick="executeFolderMerge()">
          <i class="bi bi-play-circle"></i> Execute Merge
        </button>
      </div>
    </div>
  </div>
</div>
