<!-- Upcoming Album Releases pane — part of the Downloads File Manager tabs -->
<span id="upcoming-releases" class="d-block" aria-hidden="true"></span>
<div class="d-flex flex-wrap align-items-center gap-2 mb-2">
  <label class="form-check form-check-inline mb-0">
    <input class="form-check-input" type="checkbox" id="upcomingFilterCollectionMonitor" onchange="refreshUpcomingReleasesMonitor()">
    <span class="form-check-label small">Collection only</span>
  </label>
  <select id="upcomingMonthFilterMonitor" class="form-select form-select-sm" style="width:auto;max-width:260px;" onchange="refreshUpcomingReleasesMonitor()" title="Filter by release month">
    <option value="">All Months</option>
  </select>
  <div class="ms-auto d-flex flex-wrap gap-1">
    <button class="btn btn-sm btn-primary" onclick="scrapeUpcomingReleasesMonitor()" title="Update from Wikipedia">
      <i class="bi bi-download"></i> Update Wikipedia
    </button>
    <button class="btn btn-sm btn-success" onclick="checkForUpdatesMonitor()" title="Check for updates">
      <i class="bi bi-bell"></i> Check Updates
    </button>
    <button class="btn btn-sm btn-outline-success" id="autoMatchAllMonitorBtn" onclick="autoMatchAllUpcomingReleasesMonitor(this)" title="Auto-match MusicBrainz MBID for all unmatched releases">
      <i class="bi bi-magic"></i> Auto Match
    </button>
    <button class="btn btn-sm btn-outline-primary" onclick="refreshUpcomingReleasesMonitor()" title="Refresh">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-sm btn-outline-danger" onclick="clearUpcomingReleasesMonitor()" title="Clear old entries and start fresh">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>

<div id="upcomingStatusMonitor" class="alert alert-info py-2" style="display:none;">
  <div class="d-flex">
    <div class="spinner-border spinner-border-sm me-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div>
      <span id="upcomingStatusTextMonitor">Loading upcoming releases...</span>
    </div>
  </div>
</div>

<div id="upcomingErrorMonitor" class="alert alert-danger py-2" style="display:none;"></div>

<div id="upcomingReleasesMonitor">
  <div class="text-center py-3">
    <div class="spinner-border text-primary spinner-border-sm" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 small text-muted mb-0">Loading upcoming releases...</p>
  </div>
</div>
