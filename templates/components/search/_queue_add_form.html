<!-- Add to Download Queue Form -->
<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <form id="addToQueueForm" onsubmit="addToQueue(event)">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <label for="queueArtist" class="form-label">Artist</label>
          <input type="text" id="queueArtist" class="form-control" placeholder="e.g. Daft Punk" required>
        </div>
        <div class="col-12 col-md-4">
          <label for="queueTitle" class="form-label">Title / Album</label>
          <input type="text" id="queueTitle" class="form-control" placeholder="e.g. Get Lucky" required>
        </div>
        <div class="col-12 col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1">
            <i class="bi bi-download"></i> Queue Track
          </button>
          <button type="button" class="btn btn-outline-info" onclick="showMusicBrainzModal()" title="Search full releases">
            <i class="bi bi-disc"></i>
          </button>
        </div>
      </div>
      <input type="hidden" id="queueAlbum" value="">
      <input type="hidden" id="queueSource" value="soulseek">
      <input type="hidden" id="queuePriority" value="5">
    </form>
  </div>
</div>
