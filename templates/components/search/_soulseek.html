<!-- Soulseek search panel (reusable component) -->
{% if slskd_config.enabled %}
<form id="slskdSearchForm" onsubmit="searchSoulseek(event)">
  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <label for="slskdSearchQuery" class="form-label">Search Query *</label>
      <input type="text" id="slskdSearchQuery" class="form-control" placeholder="e.g., Daft Punk - Get Lucky" required>
    </div>
    <div class="col-md-3">
      <label for="slskdSearchLimit" class="form-label">Results Limit</label>
      <input type="number" id="slskdSearchLimit" class="form-control" value="30" min="1" max="100">
    </div>
    <div class="col-md-3 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> Search
      </button>
    </div>
  </div>
</form>
{% else %}
<div class="alert alert-warning mb-0">
  <i class="bi bi-exclamation-triangle"></i> Soulseek (slskd) integration is not enabled.
  <a href="{{ url_for('ui.config_editor') }}">Configure it</a> in config.yaml.
</div>
{% endif %}

<div class="card">
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="bi bi-list-ul"></i> Results
    </h5>
  </div>
  <div class="card-body p-0">
    <div id="slskdSearchEmpty" class="alert alert-info alert-sm mb-0">
      <i class="bi bi-info-circle"></i> No search performed yet. Enter a query above!
    </div>
    <div id="slskdSearchResults" style="display:none">
      <!-- Results rendered here -->
    </div>
  </div>
</div>
