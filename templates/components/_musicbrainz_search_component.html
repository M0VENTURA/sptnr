{# 
Unified MusicBrainz Release Search Component
=============================================
Can be used inline (search form + results render directly in the page) 
or placed inside any Bootstrap modal for overlay behavior.
#}

<style>
.mb-search-form { margin-bottom: 0.75rem; }
.mb-search-form .form-control:focus,
.mb-search-form .form-select:focus {
  border-color: #22d3ee;
  box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.12);
}
.mb-results-container { max-height: 60vh; overflow-y: auto; overflow-x: hidden; }
.mb-results-container .card { transition: border-color 0.15s ease; }
.mb-results-container .card:hover { border-color: #22d3ee; }
.mb-select-btn { border-color: #6c757d; color: #adb5bd; }
.mb-select-btn:hover,
.mb-select-btn:focus { border-color: #22d3ee; color: #22d3ee; }
</style>

<!-- Search Controls -->
<div class="mb-search-form bg-dark p-2 rounded border border-secondary">
  <form onsubmit="event.preventDefault(); performMbSearch()">
    <div class="row g-2 align-items-end">
      <!-- Row 1 on Mobile: Artist & Album -->
      <div class="col-6 col-md-3">
        <label class="form-label form-label-sm mb-1 text-muted extra-small fw-semibold text-uppercase">Artist</label>
        <input type="text" class="form-control form-control-sm" id="mbSearchArtist" placeholder="Artist name">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label form-label-sm mb-1 text-muted extra-small fw-semibold text-uppercase">Album</label>
        <input type="text" class="form-control form-control-sm" id="mbSearchAlbum" placeholder="Album name">
      </div>
      <!-- Row 2 on Mobile: Track & Year -->
      <div class="col-8 col-md-3">
        <label class="form-label form-label-sm mb-1 text-muted extra-small fw-semibold text-uppercase">Track</label>
        <input type="text" class="form-control form-control-sm" id="mbSearchTrack" placeholder="Track title">
      </div>
      <div class="col-4 col-md-1">
        <label class="form-label form-label-sm mb-1 text-muted extra-small fw-semibold text-uppercase">Year</label>
        <input type="text" class="form-control form-control-sm" id="mbSearchYear" placeholder="YYYY" maxlength="4">
      </div>
      <!-- Row 3 on Mobile: Buttons -->
      <div class="col-12 col-md-2 d-flex gap-2 mt-2 mt-md-0">
        <button type="submit" class="btn btn-info btn-sm flex-grow-1 fw-bold" id="mbSearchBtn">
          <i class="bi bi-search"></i> Search
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearMbSearch()" title="Clear Form">
          <i class="bi bi-eraser-fill"></i>
        </button>
      </div>
    </div>
  </form>
</div>

<!-- Filter Bar -->
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3 px-1">
  <div class="d-flex align-items-center gap-2">
    <select id="mbReleaseType" class="form-select form-select-sm" style="width:auto;" onchange="performMbSearch()" title="Filter by release type">
      <option value="">All Release Types</option>
      <option value="album">Studio Album</option>
      <option value="single">Single</option>
      <option value="ep">EP</option>
      <option value="compilation">Compilation</option>
      <option value="soundtrack">Soundtrack</option>
      <option value="live">Live</option>
      <option value="remix">Remix</option>
    </select>
    <select id="mbResultLimit" class="form-select form-select-sm" style="width:auto;" onchange="performMbSearch()" title="Results per page">
      <option value="12">12</option>
      <option value="25" selected>25</option>
      <option value="50">50</option>
    </select>
  </div>
  <small class="text-info fw-bold" id="mbResultCount"></small>
</div>

<!-- Results -->
<div id="mbSearchResults" class="row g-2 mb-results-container px-1">
  <div class="col-12 text-center text-muted py-5">
    <i class="bi bi-hexagon-fill opacity-50" style="font-size: 3rem;"></i>
    <p class="mt-3 fw-semibold">Enter a search term above to find releases on MusicBrainz.</p>
  </div>
</div>

<!-- Selected Release Details -->
<div id="mbSelectedRelease" class="mt-3 p-3 border border-success bg-success bg-opacity-10 rounded d-none">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div class="min-w-0">
      <h6 id="mbSelectedTitle" class="mb-1 text-truncate fw-bold text-success"></h6>
      <small id="mbSelectedArtist" class="text-muted d-block text-truncate"></small>
    </div>
    <button class="btn btn-success btn-sm fw-bold flex-shrink-0" onclick="confirmReleaseSelection()">
      <i class="bi bi-check-circle-fill me-1"></i> Apply Match
    </button>
  </div>
</div>
