{# MusicBrainz Release Search — Modal Wrapper
   Wraps the unified search component in a Bootstrap modal.
   Pages that want inline search should include _musicbrainz_search_component.html directly.
#}
<div class="modal fade" id="musicBrainzModal" tabindex="-1" aria-labelledby="musicBrainzModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="musicBrainzModalLabel">
          <i class="bi bi-music-note-list"></i> MusicBrainz Release Search
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {% include 'components/_musicbrainz_search_component.html' %}
      </div>
    </div>
  </div>
</div>
