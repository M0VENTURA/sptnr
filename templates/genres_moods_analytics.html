{% extends "base.html" %}

{% block title %}Genres & Moods Analytics{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-bar-chart-line"></i> Genres & Moods Analytics</h1>
            <p class="text-muted mb-0">Top 50 genres, moods, and genre+mood combinations in your library.</p>
        </div>
        <a class="btn btn-outline-secondary" href="/dashboard">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-vinyl"></i> Top Genres</h5>
                    <span class="badge bg-primary" id="genresCount">0</span>
                </div>
                <div class="card-body">
                    <div id="genresBars" class="bar-list"></div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-emoji-smile"></i> Top Moods</h5>
                    <span class="badge bg-secondary" id="moodsCount">0</span>
                </div>
                <div class="card-body">
                    <div id="moodsBars" class="bar-list"></div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-intersect"></i> Top Genre × Mood</h5>
                    <span class="badge bg-success" id="combosCount">0</span>
                </div>
                <div class="card-body">
                    <div id="combosBars" class="bar-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.bar-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 70vh;
    overflow-y: auto;
    padding-right: 4px;
}

.metric-row {
    display: grid;
    grid-template-columns: minmax(120px, 28%) 1fr auto;
    gap: 10px;
    align-items: center;
}

.metric-label {
    font-size: 0.87rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.metric-track {
    background: rgba(120, 120, 120, 0.15);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
}

.metric-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 200ms ease;
}

.metric-fill.genre {
    background: linear-gradient(90deg, #1f6feb, #46b3ff);
}

.metric-fill.mood {
    background: linear-gradient(90deg, #6f42c1, #a371f7);
}

.metric-fill.combo {
    background: linear-gradient(90deg, #1a7f37, #56d364);
}

.metric-value {
    font-size: 0.82rem;
    color: #8b949e;
    min-width: 36px;
    text-align: right;
}

.empty-state {
    color: #8b949e;
    font-style: italic;
}

@media (max-width: 640px) {
    .metric-row {
        grid-template-columns: minmax(90px, 36%) 1fr auto;
    }
}
</style>

<script>
function renderBars(targetId, items, fillClass) {
    const container = document.getElementById(targetId);
    if (!container) return;

    if (!items || !items.length) {
        container.innerHTML = '<div class="empty-state">No data available yet.</div>';
        return;
    }

    const maxCount = Math.max(...items.map(i => Number(i.count) || 0), 1);
    container.innerHTML = items.map(item => {
        const name = (item.name || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const count = Number(item.count) || 0;
        const width = Math.max(2, Math.round((count / maxCount) * 100));
        return `
            <div class="metric-row">
                <div class="metric-label" title="${name}">${name}</div>
                <div class="metric-track">
                    <div class="metric-fill ${fillClass}" style="width:${width}%"></div>
                </div>
                <div class="metric-value">${count}</div>
            </div>
        `;
    }).join('');
}

async function loadAnalytics() {
    const response = await fetch('/api/analytics/genres-moods?limit=50');
    const data = await response.json();

    const genres = data.genres || [];
    const moods = data.moods || [];
    const combos = data.combos || [];

    document.getElementById('genresCount').textContent = genres.length;
    document.getElementById('moodsCount').textContent = moods.length;
    document.getElementById('combosCount').textContent = combos.length;

    renderBars('genresBars', genres, 'genre');
    renderBars('moodsBars', moods, 'mood');
    renderBars('combosBars', combos, 'combo');
}

document.addEventListener('DOMContentLoaded', loadAnalytics);
</script>
{% endblock %}
