{% extends "base.html" %}

{% block title %}Soulseek Search · Popularr{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="alert alert-info mb-4">
    <i class="bi bi-info-circle"></i> The Soulseek search has moved to the
    <a href="{{ url_for('ui.search') }}#soulseek" class="alert-link">unified search page</a>.
    You'll be redirected automatically.
  </div>

  <div class="card mb-4">
    <div class="card-header">
      <h5 class="card-title mb-0"><i class="bi bi-music-note-list"></i> Soulseek Search</h5>
    </div>
    <div class="card-body">
      {% include 'components/search/_soulseek.html' %}
    </div>
  </div>
</div>

<script src="{{url_for('static', filename='js/downloads.js')}}"></script>

<script>
// Redirect to unified search after a brief pause
setTimeout(function() {
  window.location.href = '{{ url_for("ui.search") }}#soulseek';
}, 5000);
</script>
{% endblock %}
