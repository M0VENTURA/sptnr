{% extends "base.html" %}

{% block title %}Playlist Downloads · Popularr{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="alert alert-info mb-4">
    <i class="bi bi-info-circle"></i> The playlist import has moved to the
    <a href="{{ url_for('ui.search') }}#playlists" class="alert-link">unified search page</a>.
    You'll be redirected automatically.
  </div>

  {% include 'components/search/_playlists.html' %}
</div>

<script src="{{ versioned_static('js/downloads.js') }}"></script>
<script>
setTimeout(function() {
  window.location.href = '{{ url_for("ui.search") }}#playlists';
}, 5000);
</script>
{% endblock %}
