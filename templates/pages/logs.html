{% extends "base.html" %}

{% block title %}Logs - Popularr{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="mb-0"><i class="bi bi-journal-text"></i> Application Logs</h4>
        <small class="text-muted">Directory: {{ log_dir }}</small>
    </div>

    <div class="mb-3">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <select id="logSelector" class="form-select form-select-sm" style="min-width:200px;">
                    {% for f in log_files %}
                    <option value="{{ f.name }}" data-path="{{ f.path }}">{{ f.name }} ({{ '{:.1f}'.format(f.size / 1024) }} KB)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button id="refreshLogBtn" class="btn btn-primary btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
            <div class="col-auto">
                <button id="toggleAutoRefresh" class="btn btn-outline-secondary btn-sm"><i class="bi bi-play"></i> Auto-refresh</button>
            </div>
            <div class="col-auto">
                <button id="clearLogBtn" class="btn btn-warning btn-sm"><i class="bi bi-trash"></i> Clear</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center py-2 px-3">
            <span class="fw-semibold"><i class="bi bi-terminal"></i> <span id="currentLogLabel">{{ log_files[0].name if log_files else 'No logs' }}</span></span>
            <div class="d-flex gap-2 align-items-center">
                <label class="form-check-label small me-1" for="wrapLinesCheck">Wrap</label>
                <input class="form-check-input" type="checkbox" id="wrapLinesCheck" style="margin-top:0;">
            </div>
        </div>
        <div class="card-body p-2">
            <pre id="logOutput" class="bg-dark text-light p-3 mb-0" style="height: 600px; overflow-y: scroll; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.4; white-space: pre; word-wrap: normal;"></pre>
        </div>
    </div>
</div>

<script>
(function () {
    var logOutput = document.getElementById('logOutput');
    var logSelector = document.getElementById('logSelector');
    var currentLogLabel = document.getElementById('currentLogLabel');
    var refreshBtn = document.getElementById('refreshLogBtn');
    var toggleAutoBtn = document.getElementById('toggleAutoRefresh');
    var clearBtn = document.getElementById('clearLogBtn');
    var wrapCheck = document.getElementById('wrapLinesCheck');
    var autoRefreshInterval = null;
    var autoRefreshOn = false;

    function loadLog() {
        var selected = logSelector.options[logSelector.selectedIndex];
        if (!selected) return;
        var name = selected.value;
        currentLogLabel.textContent = name;
        logOutput.textContent = 'Loading...';
        fetch('/api/log-file?name=' + encodeURIComponent(name) + '&lines=500')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && data.lines) {
                    logOutput.textContent = data.lines.join('\n');
                } else if (data && data.error) {
                    logOutput.textContent = 'Error: ' + data.error;
                } else {
                    logOutput.textContent = 'No log content available.';
                }
                logOutput.scrollTop = logOutput.scrollHeight;
            })
            .catch(function(err) {
                logOutput.textContent = 'Error loading log: ' + err.message;
            });
    }

    refreshBtn.addEventListener('click', loadLog);

    clearBtn.addEventListener('click', function() {
        logOutput.textContent = '';
    });

    toggleAutoBtn.addEventListener('click', function() {
        if (autoRefreshOn) {
            clearInterval(autoRefreshInterval);
            autoRefreshOn = false;
            toggleAutoBtn.innerHTML = '<i class="bi bi-play"></i> Auto-refresh';
            toggleAutoBtn.classList.remove('btn-danger');
            toggleAutoBtn.classList.add('btn-outline-secondary');
        } else {
            loadLog();
            autoRefreshInterval = setInterval(loadLog, 5000);
            autoRefreshOn = true;
            toggleAutoBtn.innerHTML = '<i class="bi bi-stop"></i> Stop';
            toggleAutoBtn.classList.remove('btn-outline-secondary');
            toggleAutoBtn.classList.add('btn-danger');
        }
    });

    wrapCheck.addEventListener('change', function() {
        logOutput.style.whiteSpace = this.checked ? 'pre-wrap' : 'pre';
        logOutput.style.wordWrap = this.checked ? 'break-word' : 'normal';
    });

    logSelector.addEventListener('change', loadLog);

    // Initial load
    loadLog();
})();
</script>

{% endblock %}
