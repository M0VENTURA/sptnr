{% extends "base.html" %}

{% block title %}Soulseek Search · Popularr{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="mb-4">
    <h1 class="h2 mb-2">
      <i class="bi bi-download"></i> Music Downloads
      <a href="/help/FEATURES_DOWNLOADS" class="btn btn-sm btn-outline-success ms-2" title="Help for Downloads">
          <i class="bi bi-question-circle"></i>
      </a>
    </h1>
    <p class="text-muted mb-0">Search and download music from Soulseek</p>
  </div>
<!-- Soulseek Search -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="card-title mb-0">
        <i class="bi bi-music-note-list"></i> Soulseek Search
      </h5>
    </div>
    <div class="card-body">
      <form id="slskdSearchForm" onsubmit="searchSoulseek(event)">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="slskdSearchQuery" class="form-label">Search Query *</label>
            <input type="text" id="slskdSearchQuery" class="form-control" placeholder="e.g., Daft Punk - Get Lucky" required>
          </div>
          <div class="col-md-3">
            <label for="slskdSearchLimit" class="form-label">Results Limit</label>
            <input type="number" id="slskdSearchLimit" class="form-control" value="30" min="1" max="100">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Search Results -->
  <div class="card">
    <div class="card-header">
      <h5 class="card-title mb-0">
        <i class="bi bi-list-ul"></i> Results
      </h5>
    </div>
    <div class="card-body p-0">
      <div id="slskdSearchEmpty" class="alert alert-info alert-sm mb-0">
        <i class="bi bi-info-circle"></i> No search performed yet. Enter a query above!
      </div>
      <div id="slskdSearchResults" style="display:none">
        <!-- Results rendered here -->
      </div>
    </div>
  </div>
</div>

<!-- Include existing JavaScript -->
<script src="{{url_for('static', filename='js/downloads.js')}}"></script>

<!-- Initialize Soulseek search from URL parameters -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Check if there's a 'q' parameter in the URL (from queue search redirect)
  const params = new URLSearchParams(window.location.search);
  const queryParam = params.get('q');
  
  if (queryParam) {
    const searchInput = document.getElementById('slskdSearchQuery');
    if (searchInput) {
      searchInput.value = typeof normalizeSoulseekQuery === 'function'
        ? normalizeSoulseekQuery(queryParam)
        : queryParam;
      // Auto-submit the search form with the parameter
      setTimeout(() => {
        const form = document.getElementById('slskdSearchForm');
        if (form) {
          form.dispatchEvent(new Event('submit'));
        }
      }, 100);
    }
  }
});
</script>
{% endblock %}
