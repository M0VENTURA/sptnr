<!-- Tag Editor Component for Track and Album Views -->

<div id="tagEditorModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">Edit Metadata Tags</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body">
        <!-- Conflict Warning -->
        <div id="conflictWarning" class="alert alert-warning d-none" role="alert">
          <i class="bi bi-exclamation-circle-fill"></i>
          <strong>Metadata Conflicts Detected:</strong>
          <div id="conflictDetails" style="margin-top: 10px; font-size: 0.9rem;"></div>
        </div>
        
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item">
            <a class="nav-link active" href="#basicTags" data-bs-toggle="tab" role="tab">Basic Info</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#creditsTags" data-bs-toggle="tab" role="tab">Credits</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#releaseTags" data-bs-toggle="tab" role="tab">Release Info</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#musicbrainzTags" data-bs-toggle="tab" role="tab">MusicBrainz</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#technicalTags" data-bs-toggle="tab" role="tab">Technical</a>
          </li>
        </ul>
        
        <!-- Tab Content -->
        <div class="tab-content mt-3">
          <!-- Basic Info Tab -->
          <div class="tab-pane fade show active" id="basicTags" role="tabpanel">
            <div class="mb-3">
              <label class="form-label fw-bold">Title</label>
              <input type="text" class="form-control" data-field="title" placeholder="Song title">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Artist</label>
              <input type="text" class="form-control" data-field="artist" placeholder="Track artist">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Album</label>
              <input type="text" class="form-control" data-field="album" placeholder="Album name">
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Album Artist</label>
                <input type="text" class="form-control" data-field="album_artist" placeholder="Album artist" data-conflict-field="albumartist">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Album Artist (Raw)</label>
                <input type="text" class="form-control" data-field="albumartist" placeholder="Album artist (raw)" data-conflict-field="album_artist">
                <small class="form-text text-muted">Raw metadata field - may differ from album_artist</small>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Artist Sort</label>
                <input type="text" class="form-control" data-field="artistsort" placeholder="Lastname, Firstname">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Album Artist Sort</label>
                <input type="text" class="form-control" data-field="albumartistsort" placeholder="Lastname, Firstname">
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Genre</label>
              <input type="text" class="form-control" data-field="genre" placeholder="Genre">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Work / Composition</label>
              <input type="text" class="form-control" data-field="work" placeholder="Musical work name">
            </div>
          </div>
          
          <!-- Credits Tab -->
          <div class="tab-pane fade" id="creditsTags" role="tabpanel">
            <div class="mb-3">
              <label class="form-label fw-bold">Composer/Songwriter</label>
              <input type="text" class="form-control" data-field="composer" placeholder="Composer (comma-separated for multiple)">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Arranger</label>
              <input type="text" class="form-control" data-field="arranger" placeholder="Arranger">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Producer(s)</label>
              <input type="text" class="form-control" data-field="producer" placeholder="Producer (comma-separated for multiple)">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Mixer/Engineer</label>
              <input type="text" class="form-control" data-field="mixer" placeholder="Audio mixer/engineer">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Writer(s)</label>
              <input type="text" class="form-control" data-field="writer" placeholder="Songwriter (comma-separated for multiple)">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Performer(s)</label>
              <input type="text" class="form-control" data-field="performer" placeholder="Performers with instruments (comma-separated)">
            </div>
          </div>
          
          <!-- Release Info Tab -->
          <div class="tab-pane fade" id="releaseTags" role="tabpanel">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Release Year</label>
                <input type="number" class="form-control" data-field="year" placeholder="YYYY" min="1800" max="2100">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Original Release Year</label>
                <input type="number" class="form-control" data-field="originalyear" placeholder="YYYY" min="1800" max="2100">
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Release Date (YYYY-MM-DD)</label>
                <input type="text" class="form-control" data-field="originaldate" placeholder="YYYY-MM-DD" pattern="^\d{4}-\d{2}-\d{2}$">
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Release Status</label>
              <select class="form-select" data-field="releasestatus">
                <option value="">-- Select --</option>
                <option value="official">Official</option>
                <option value="promotion">Promotion</option>
                <option value="bootleg">Bootleg</option>
                <option value="pseudo-release">Pseudo-Release</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Release Type</label>
              <select class="form-select" data-field="releasetype">
                <option value="">-- Select --</option>
                <option value="album">Album</option>
                <option value="single">Single</option>
                <option value="ep">EP</option>
                <option value="compilation">Compilation</option>
                <option value="soundtrack">Soundtrack</option>
                <option value="live">Live</option>
                <option value="remix">Remix</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Record Label</label>
              <input type="text" class="form-control" data-field="label" placeholder="Label name">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Release Country</label>
              <input type="text" class="form-control" data-field="releasecountry" placeholder="Country code (e.g., US, GB, DE)">
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Media Type</label>
                <select class="form-select" data-field="media">
                  <option value="">-- Select --</option>
                  <option value="CD">CD</option>
                  <option value="Vinyl">Vinyl</option>
                  <option value="Digital Media">Digital</option>
                  <option value="Cassette">Cassette</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Barcode (UPC/EAN)</label>
                <input type="text" class="form-control" data-field="barcode" placeholder="Barcode/UPC">
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Catalog Number</label>
                <input type="text" class="form-control" data-field="catalognumber" placeholder="Catalog number">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">ASIN</label>
                <input type="text" class="form-control" data-field="asin" placeholder="Amazon Standard ID">
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Total Discs</label>
                <input type="number" class="form-control" data-field="totaldiscs" placeholder="Number of discs" min="1">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Disc Number</label>
                <input type="number" class="form-control" data-field="disc_number" placeholder="Disc #" min="1">
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Total Tracks</label>
                <input type="number" class="form-control" data-field="tracktotal" placeholder="Tracks on album" min="1">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Track Number</label>
                <input type="number" class="form-control" data-field="track_number" placeholder="Track #" min="1">
              </div>
            </div>
          </div>
          
          <!-- MusicBrainz Tab -->
          <div class="tab-pane fade" id="musicbrainzTags" role="tabpanel">
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Track ID</label>
              <input type="text" class="form-control" data-field="mbid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
              <small class="form-text text-muted">Recording MBID</small>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Album ID</label>
              <input type="text" class="form-control" data-field="musicbrainz_albumid" placeholder="Album/Release MBID">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Release Group ID</label>
              <input type="text" class="form-control" data-field="musicbrainz_releasegroupid" placeholder="Release Group MBID">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Release Track ID</label>
              <input type="text" class="form-control" data-field="musicbrainz_releasetrackid" placeholder="Release Track MBID">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Work ID</label>
              <input type="text" class="form-control" data-field="musicbrainz_workid" placeholder="Work MBID">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Album Artist ID</label>
              <input type="text" class="form-control" data-field="musicbrainz_albumartistid" placeholder="Album Artist MBID">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Album Status</label>
              <select class="form-select" data-field="musicbrainz_albumstatus">
                <option value="">-- Select --</option>
                <option value="official">Official</option>
                <option value="promotion">Promotion</option>
                <option value="bootleg">Bootleg</option>
                <option value="pseudo-release">Pseudo-Release</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">MusicBrainz Album Type</label>
              <select class="form-select" data-field="musicbrainz_albumtype">
                <option value="">-- Select --</option>
                <option value="album">Album</option>
                <option value="single">Single</option>
                <option value="ep">EP</option>
                <option value="compilation">Compilation</option>
                <option value="soundtrack">Soundtrack</option>
                <option value="live">Live</option>
                <option value="remix">Remix</option>
              </select>
            </div>
          </div>
          
          <!-- Technical Tab -->
          <div class="tab-pane fade" id="technicalTags" role="tabpanel">
            <div class="mb-3">
              <label class="form-label fw-bold">ISRC (International Standard Recording Code)</label>
              <input type="text" class="form-control" data-field="isrc" placeholder="ISRC code" pattern="^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$">
              <small class="form-text text-muted">Format: CCXXXYY###### (e.g., USRC17607839)</small>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">BPM (Tempo)</label>
                <input type="number" class="form-control" data-field="bpm" placeholder="Beats per minute" min="0" max="500">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Script</label>
                <input type="text" class="form-control" data-field="script" maxlength="4" placeholder="Script code (e.g., Latn, Cyrl)">
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <div class="form-check me-auto">
          <input class="form-check-input" type="checkbox" id="syncToFileCheckbox">
          <label class="form-check-label" for="syncToFileCheckbox">
            Sync changes to audio file
          </label>
        </div>
        
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveTagsBtn">
          <i class="bi bi-check-circle"></i> Save Tags
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Tag Editor JavaScript
(function() {
  const modalEl = document.getElementById('tagEditorModal');
  const modal = modalEl ? new bootstrap.Modal(modalEl) : null;
  let currentMode = 'track'; // 'track' or 'album'
  let currentTrackId = null;
  let currentAlbum = null;
  let currentArtist = null;
  
  // Highlight conflicting fields
  function highlightConflicts(conflicts) {
    const warning = document.getElementById('conflictWarning');
    const details = document.getElementById('conflictDetails');
    
    if (!conflicts || Object.keys(conflicts).length === 0) {
      warning.classList.add('d-none');
      return;
    }
    
    warning.classList.remove('d-none');
    details.innerHTML = '';
    
    for (const [field, values] of Object.entries(conflicts)) {
      if (field === 'album_artist_vs_albumartist') {
        const div = document.createElement('div');
        div.innerHTML = `
          <strong>Album Artist Mismatch:</strong>
          <ul style="margin-bottom: 0;">
            <li><code>album_artist</code>: ${values.album_artist.join(', ')}</li>
            <li><code>albumartist</code>: ${values.albumartist.join(', ')}</li>
          </ul>
        `;
        details.appendChild(div);
        
        // Highlight the conflicting fields
        document.querySelectorAll('[data-conflict-field="album_artist"]').forEach(el => {
          el.classList.add('is-invalid');
        });
        document.querySelectorAll('[data-conflict-field="albumartist"]').forEach(el => {
          el.classList.add('is-invalid');
        });
      } else {
        const div = document.createElement('div');
        div.innerHTML = `<strong>${field}:</strong> Multiple values found: ${values.join(', ')}`;
        details.appendChild(div);
      }
    }
  }
  
  // Load tags into the form
  function loadTags(tags) {
    // Clear all inputs
    document.querySelectorAll('[data-field]').forEach(el => {
      el.classList.remove('is-invalid');
      if (el.tagName === 'SELECT') {
        el.value = '';
      } else {
        el.value = '';
      }
    });
    
    // Load values
    for (const [field, value] of Object.entries(tags)) {
      const el = document.querySelector(`[data-field="${field}"]`);
      if (el) {
        if (Array.isArray(value)) {
          el.value = value.join(', ');
        } else {
          el.value = value || '';
        }
      }
    }
  }
  
  // Get updated tags from form
  function getUpdatedTags() {
    const tags = {};
    document.querySelectorAll('[data-field]').forEach(el => {
      const field = el.dataset.field;
      let value = el.value;
      
      // Skip empty fields
      if (!value) {
        return;
      }
      
      // Convert array fields
      if (['artists', 'performer', 'producer', 'writer'].includes(field)) {
        value = value.split(',').map(v => v.trim()).filter(v => v);
      }
      
      tags[field] = value;
    });
    
    return tags;
  }
  
  // Save tags
  async function saveTags() {
    const tags = getUpdatedTags();
    const syncToFile = document.getElementById('syncToFileCheckbox').checked;
    
    if (Object.keys(tags).length === 0) {
      alert('No changes to save');
      return;
    }
    
    try {
      let endpoint, payload;
      
      if (currentMode === 'track') {
        endpoint = `/api/tags/track/${currentTrackId}`;
        payload = { tags, sync_to_file: syncToFile };
      } else {
        endpoint = `/api/tags/album/${encodeURIComponent(currentAlbum)}/${encodeURIComponent(currentArtist)}`;
        payload = { tags, sync_to_files: syncToFile };
      }
      
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!response.ok) {
        const error = await response.json();
        alert(`Error: ${error.error || 'Failed to save tags'}`);
        return;
      }
      
      const result = await response.json();
      alert(`Success! ${result.message}`);
      
      // Reload page or refresh relevant data
      location.reload();
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  }
  
  // Public API for opening the editor
  window.editTrackTags = async function(trackId) {
    currentMode = 'track';
    currentTrackId = trackId;
    currentAlbum = null;
    currentArtist = null;
    
    try {
      const response = await fetch(`/api/tags/track/${trackId}`);
      if (!response.ok) throw new Error('Failed to load tags');
      
      const data = await response.json();
      loadTags(data.tags);
      document.querySelector('.modal-title').textContent = `Edit Track Tags - ${data.tags.title || 'Unknown'}`;
      modal.show();
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  };
  
  window.editAlbumTags = async function(album, artist) {
    currentMode = 'album';
    currentAlbum = album;
    currentArtist = artist;
    currentTrackId = null;
    
    try {
      const response = await fetch(
        `/api/tags/album/${encodeURIComponent(album)}/${encodeURIComponent(artist)}`
      );
      if (!response.ok) throw new Error('Failed to load album tags');
      
      const data = await response.json();
      loadTags(data.tags);
      highlightConflicts(data.conflicts);
      document.querySelector('.modal-title').textContent = `Edit Album Tags - ${artist} - ${album}`;
      modal.show();
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  };
  
  // Save button listener
  if (document.getElementById('saveTagsBtn')) {
    document.getElementById('saveTagsBtn').addEventListener('click', saveTags);
  }
})();
</script>
